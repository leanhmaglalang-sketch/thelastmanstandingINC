  <!-- Slide 5: The Spinning Wheel (Interactive) -->
  <style>
    .wheel-slide {
      background: linear-gradient(135deg, #050A1F 0%, #0B132B 50%, #1A2A54 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      overflow: hidden;
    }
    .wheel-header {
      text-align: center;
      margin-bottom: 20px;
      z-index: 10;
    }
    .wheel-title {
      font-size: 48px;
      font-weight: 900;
      color: #FFFFFF;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0px 4px 16px rgba(65, 105, 225, 0.8);
    }
    .wheel-subtitle {
      font-size: 24px;
      font-weight: 700;
      color: #C0C0C0;
      margin: 10px 0 0 0;
      letter-spacing: 2px;
    }
    .wheel-wrapper {
      position: relative;
      width: 480px;
      height: 480px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pointer-container {
      position: absolute;
      top: -20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .pointer-body {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 45px solid #C0C0C0;
      filter: drop-shadow(0px 6px 6px rgba(0,0,0,0.7));
    }
    canvas {
      border-radius: 50%;
      box-shadow: 0 0 0 10px #C0C0C0, 0 0 30px 15px rgba(65, 105, 225, 0.4);
      transform-origin: center center;
    }
    .spin-btn {
      margin-top: 35px;
      padding: 16px 48px;
      font-size: 28px;
      font-weight: 900;
      font-family: 'Century Gothic', 'Montserrat', sans-serif;
      color: #FFFFFF;
      background: linear-gradient(180deg, #4169E1 0%, #1A2A54 100%);
      border: 2px solid #C0C0C0;
      border-radius: 40px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
      transition: all 0.2s ease;
      z-index: 10;
    }
    .spin-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(65, 105, 225, 0.6), inset 0 2px 4px rgba(255,255,255,0.6);
    }
    .spin-btn:active {
      transform: scale(0.95);
    }
    .result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 31, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .result-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .result-title {
      font-size: 32px;
      font-weight: 700;
      color: #C0C0C0;
      margin-bottom: 24px;
      letter-spacing: 4px;
    }
    .result-category {
      font-size: 56px;
      font-weight: 900;
      color: #FFFFFF;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 20px #4169E1, 0 0 40px #4169E1, 0 0 60px #1A2A54;
      max-width: 90%;
      line-height: 1.2;
    }
    .close-result-btn {
      margin-top: 56px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Century Gothic', 'Montserrat', sans-serif;
      color: #050A1F;
      background: #C0C0C0;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: background 0.2s;
    }
    .close-result-btn:hover {
      background: #FFFFFF;
    }
  </style>

  <div class="slide-container wheel-slide" id="slide5">
    <div class="wheel-header">
      <h1 class="wheel-title">The Last Man Standing</h1>
      <h2 class="wheel-subtitle">SPIN THE WHEEL – CATEGORY CHALLENGE!</h2>
    </div>
    
    <div class="wheel-wrapper">
      <div class="pointer-container">
        <div class="pointer-body"></div>
      </div>
      <canvas id="wheelCanvas" width="480" height="480"></canvas>
    </div>
    
    <button class="spin-btn" id="spinBtn">SPIN THE WHEEL!</button>

    <div class="result-overlay" id="resultOverlay">
      <div class="result-title">YOUR CATEGORY IS...</div>
      <div class="result-category" id="resultCategoryText">CATEGORY NAME</div>
      <button class="close-result-btn" id="closeResultBtn">CONTINUE</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const spinBtn = document.getElementById('spinBtn');
      const resultOverlay = document.getElementById('resultOverlay');
      const resultCategoryText = document.getElementById('resultCategoryText');
      const closeResultBtn = document.getElementById('closeResultBtn');

      const numSegments = 5;
      const segmentAngle = (2 * Math.PI) / numSegments;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;

      // Theme Colors mapping
      const wheelColors = ["#4169E1", "#C0C0C0", "#1A2A54", "#808080", "#000033"];
      const textColors = ["#FFFFFF", "#050A1F", "#FFFFFF", "#FFFFFF", "#C0C0C0"];

      // Broken down for Canvas fitting
      const categoriesText = [
        ["TOURIST", "ATTRACTIONS"],
        ["FAST FOOD CHAINS", "& RESTAURANTS"],
        ["DATE NIGHT", "ACTIVITIES"],
        ["GIFTS FOR", "YOUR SPOUSE"],
        ["THINGS YOU CAN", "FIND AT HOME"]
      ];

      // Full Announcement Texts
      const fullCategories = [
        "TOURIST ATTRACTIONS",
        "FAST FOOD CHAINS & RESTAURANTS",
        "DATE NIGHT ACTIVITIES",
        "GIFTS FOR YOUR SPOUSE",
        "THINGS YOU CAN FIND AT HOME"
      ];

      function drawWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < numSegments; i++) {
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          // Draw arc starting from top (-90 degrees) for proper alignment
          ctx.arc(centerX, centerY, radius, i * segmentAngle - Math.PI/2 - segmentAngle/2, (i + 1) * segmentAngle - Math.PI/2 - segmentAngle/2);
          ctx.fillStyle = wheelColors[i];
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#808080';
          ctx.stroke();

          // Draw Text
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(i * segmentAngle - Math.PI/2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = textColors[i];
          ctx.font = "bold 18px 'Century Gothic', 'Montserrat', sans-serif";
          
          const textRadius = radius - 25;
          const lines = categoriesText[i];
          if (lines.length === 1) {
            ctx.fillText(lines[0], textRadius, 0);
          } else {
            ctx.fillText(lines[0], textRadius, -12);
            ctx.fillText(lines[1], textRadius, 12);
          }
          ctx.restore();
        }
      }
      
      drawWheel();

      let currentRotation = 0;
      let isSpinning = false;

      spinBtn.addEventListener('click', () => {
        if(isSpinning) return;
        isSpinning = true;
        spinBtn.innerText = "SPINNING...";
        
        // Ensure random selection (0 to 4)
        const targetIndex = Math.floor(Math.random() * 5);
        const sliceAngle = 360 / 5;
        
        // Calculate the rotation angle needed to place target slice perfectly at top center
        const targetRotation = 360 - (targetIndex * sliceAngle);
        
        // Add random jitter to stop at different parts within the wedge (prevent landing exactly on a line)
        const jitter = (Math.random() * 40) - 20; 
        
        // Rotate rapidly 7-10 times before slowing down to land
        const spins = 7 + Math.floor(Math.random() * 4); 
        
        const totalRotation = currentRotation + (spins * 360) + targetRotation - (currentRotation % 360) + jitter;
        currentRotation = totalRotation;
        
        // Apply spinning transition smoothly using CSS cubic-bezier
        canvas.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
        canvas.style.transform = `rotate(${currentRotation}deg)`;
        
        // Display result modal when animation ends
        setTimeout(() => {
          isSpinning = false;
          spinBtn.innerText = "SPIN AGAIN!";
          
          resultCategoryText.innerText = fullCategories[targetIndex];
          resultOverlay.classList.add('active');
        }, 5200);
      });

      closeResultBtn.addEventListener('click', () => {
        resultOverlay.classList.remove('active');
      });
    });
  </script>

</body></html>
